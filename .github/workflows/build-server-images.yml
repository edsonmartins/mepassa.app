name: Build and Push Server Images

on:
  push:
    branches: [main, feat/rebrand-zaplivre]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: integrall-tech

# Configure GHCR_USERNAME and GHCR_TOKEN as
# repository secrets. The token must have package write permission in the
# integrall-tech organization.

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - binary: zaplivre-identity-server
            image: zaplivre-identity
          - binary: zaplivre-store
            image: zaplivre-store
          - binary: zaplivre-push
            image: zaplivre-push
          - binary: turn-credentials
            image: zaplivre-turn-credentials
          - binary: zaplivre-signaling
            image: zaplivre-signaling
          - binary: zaplivre-bootstrap
            image: zaplivre-bootstrap
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          # F4: sem tag `latest` no GHCR — deploys devem usar tag explícita
          # (sha/branch/semver). O deploy.sh também rejeita ZAPLIVRE_TAG=latest.
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/Dockerfile.server
          build-args: SERVICE_BIN=${{ matrix.binary }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # F4: scan de vulnerabilidades (não-bloqueante) + SBOM (CycloneDX).
      # Relatórios e SBOMs são expostos como artifacts para auditoria.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        if: github.event_name != 'pull_request'
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          output: trivy-${{ matrix.image }}.txt
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: trivy-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.txt
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@0.28.0
        if: github.event_name != 'pull_request'
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom-${{ matrix.image }}.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.json
