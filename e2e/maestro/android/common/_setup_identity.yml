# Helper de setup: garante identidade fresca e app na tela de Conversas.
#
# clearState a cada setup torna cada flow autossuficiente e determinístico
# (mesma estrutura validada nos flows iOS). Esperar o botão renderizar de forma
# estável ANTES de tocar evita o timing do splash do FFI — um `runFlow when:`
# imediato é avaliado antes de o onboarding aparecer e é pulado por engano.
appId: com.zaplivre
---
- clearState
# Username único por execução (timestamp) — evita colisão entre runs.
- evalScript: ${output.e2e_username = 'u' + Date.now()}
# Pré-concede notificações (POST_NOTIFICATIONS no Android 13+): o diálogo
# do sistema cobriria a tela de onboarding e interceptaria os toques.
- launchApp:
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible:
      id: "onboarding_create"
    timeout: 30000
- tapOn:
    id: "onboarding_create"
# Onboarding com registro de username (diálogo "Escolha seu username").
# O Peer ID é gerado após registrar; username único evita colisão.
- extendedWaitUntil:
    visible: "Escolha seu username"
    timeout: 15000
# O AlertDialog do Compose cria uma janela própria: os testTags só resolvem
# com testTagsAsResourceId no conteúdo do diálogo (onboarding_username_input/
# onboarding_register), que não herda o flag da raiz do MainActivity.
- tapOn:
    id: "onboarding_username_input"
- inputText: ${output.e2e_username}
- tapOn:
    id: "onboarding_register"
# Registro concluído: auto-navega para a tela de Conversas. No Android o
# título da tela é "ZapLivre"; usa o testTag estável como marcador.
- extendedWaitUntil:
    visible:
      id: "conversations_settings"
    timeout: 30000
